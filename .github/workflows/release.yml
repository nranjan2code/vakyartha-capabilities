# Publishes one signed release. Runs only for a tag the owner pushes after signing;
# it never signs, never changes a version, and stops if the signature does not verify.
name: Release
on:
  push:
    tags: ["capabilities-v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/check.ts --online --tag "$GITHUB_REF_NAME"
      - run: node --test tests/ "apps/*/test/*.test.ts"
      - run: node scripts/verify.ts site
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vakyartha Capabilities ${GITHUB_REF_NAME#capabilities-v}" --notes "Signed catalog release. Verify index.json with index.json.sig and keys/catalog.pub." site/index.json site/index.json.sig site/SHA256SUMS.txt site/archives/*
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
